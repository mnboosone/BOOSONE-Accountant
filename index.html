<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2d6a4f" />
  <meta name="description" content="BOOS ONE Accountant - حسابداری شخصی" />
  <title>BOOS ONE Accountant</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
  <!-- Splash -->
  <div id="splash-screen">
    <div class="splash-content">
      <h1>BOOS ONE</h1>
      <p>Accountant</p>
    </div>
  </div>

  <!-- Home -->
  <div id="home-page" class="page">
    <header class="header">
      <h1>BOOS ONE</h1>
      <p class="subtitle">Accountant — حسابدار</p>
    </header>

    <div class="summary-bar" onclick="openSummary()">
      <div class="sum-item">
        <span class="sum-label">امروز</span>
        <span class="sum-value" id="home-today">۰</span>
      </div>
      <div class="sum-item">
        <span class="sum-label">این ماه</span>
        <span class="sum-value" id="home-month">۰</span>
      </div>
      <div class="sum-arrow">گزارش ←</div>
    </div>

    <div class="sections-grid" id="sections-grid"></div>
  </div>

  <!-- Category page (list of entries) -->
  <div id="section-page" class="page">
    <header class="header">
      <button class="btn-back" onclick="goHome()">← بازگشت</button>
      <h1 id="section-title">عنوان</h1>
    </header>

    <div id="normal-section-ui">
      <div class="toolbar">
        <button class="btn-primary" onclick="showAddForm()">+ ثبت جدید</button>
      </div>
      <div id="add-form" class="form-card hidden">
        <input type="number" id="entry-amount" placeholder="مبلغ (تومان)" inputmode="numeric" />
        <input type="date" id="entry-date" />
        <textarea id="entry-note" placeholder="توضیحات..." rows="2"></textarea>
        <div class="form-actions">
          <button class="btn-primary" onclick="saveEntry()">ذخیره</button>
          <button class="btn-secondary" onclick="hideAddForm()">انصراف</button>
        </div>
      </div>
      <div id="entries-list" class="entries-list"></div>
    </div>

    <!-- Reminders UI -->
    <div id="reminder-section-ui" class="hidden">
      <div class="toolbar">
        <button class="btn-primary" onclick="showAddReminderForm()">+ یادآوری جدید</button>
      </div>
      <div id="add-reminder-form" class="form-card hidden">
        <input type="text" id="rem-title" placeholder="عنوان (مثلاً پرداخت چک فلان)" />
        <textarea id="rem-note" placeholder="توضیحات..." rows="2"></textarea>
        <label class="form-label">تاریخ یادآوری:</label>
        <input type="date" id="rem-date" />
        <div class="form-actions">
          <button class="btn-primary" onclick="saveReminder()">ذخیره</button>
          <button class="btn-secondary" onclick="hideAddReminderForm()">انصراف</button>
        </div>
      </div>
      <div id="reminders-list" class="entries-list"></div>
    </div>
  </div>

  <!-- Summary / Report page -->
  <div id="summary-page" class="page">
    <header class="header">
      <button class="btn-back" onclick="goHome()">← بازگشت</button>
      <h1>گزارش کلی</h1>
    </header>

    <div class="filter-box">
      <button class="filter-btn active" onclick="setFilter('today', this)">امروز</button>
      <button class="filter-btn" onclick="setFilter('month', this)">این ماه</button>
      <button class="filter-btn" onclick="setFilter('custom', this)">بازه دلخواه</button>
    </div>

    <div id="custom-range" class="form-card hidden">
      <label class="form-label">از تاریخ:</label>
      <input type="date" id="from-date" />
      <label class="form-label">تا تاریخ:</label>
      <input type="date" id="to-date" />
      <button class="btn-primary" style="width:100%;margin-top:10px" onclick="applyCustomRange()">اعمال</button>
    </div>

    <div class="report-total-card">
      <div class="rt-row">
        <span>جمع هزینه‌ها</span>
        <span id="rep-expense" class="amount expense">۰</span>
      </div>
      <div class="rt-row">
        <span>جمع دریافتی‌ها</span>
        <span id="rep-income" class="amount income">۰</span>
      </div>
      <div class="rt-row total-row">
        <span>مانده</span>
        <span id="rep-balance" class="amount">۰</span>
      </div>
    </div>

    <h3 class="report-heading">جزئیات هر بخش</h3>
    <div id="report-by-category" class="entries-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
